<!-- MLA Bot page snippet — full-page chat with a BOT SELECTOR. (v9.4: stable between the fixed site header + bottom menu, dark/light theme support — script enqueued from the MLA Bots plugin; CSS also comes from the plugin's wp_head, NOT from this snippet — WordPress/Elementor strips <div id="mla-bot-page" style="max-width:560px;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;background:var(--mla-bg);display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:contain;-webkit-tap-highlight-color:transparent;">
  <div class="mla-hdr" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--mla-border);">
    <button id="mla-bot-back" type="button" aria-label="বট তালিকা" style="border:none;background:none;color:#0088cc;font-size:28px;line-height:1;padding:0 4px;cursor:pointer;touch-action:manipulation;">‹</button>
    <div id="mla-bot-avatar" class="mla-hdr-av" style="width:42px;height:42px;flex:0 0 42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;">🤖</div>
    <div style="flex:1;min-width:0;">
      <div id="mla-bot-title" style="font-weight:700;font-size:16px;color:var(--mla-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">MLA Bot</div>
      <div id="mla-bot-sub" style="font-size:13px;color:var(--mla-text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">বট বেছে নিন • v9.4</div>
    </div>
  </div>
  <div id="mla-bot-picker" style="background:var(--mla-bg);border-bottom:1px solid var(--mla-border);"></div>

  <div id="mla-bot-list" style="height:55vh;min-height:320px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background-color:var(--mla-list-bg);background-image:radial-gradient(var(--mla-dot) 1px,transparent 1.2px);background-size:16px 16px;"></div>

    <button type="submit" aria-label="Send" class="mla-send"
      style="width:46px;height:46px;flex:0 0 46px;border:none;border-radius:50%;background:linear-gradient(135deg,#2ea6e0,#0088cc);color:#fff;font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,136,204,.4);touch-action:manipulation;">➤</button>
  </form>
</div>
